<!DOCTYPE html>
<html>
<head>
    <title>JARVIS - Your Personal AI Assistant</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Custom Header */
        .jarvis-header {
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            color: white;
            padding: 15px 25px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        
        /* Messages Container */
        #messages { 
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        
        /* Message Bubbles */
        .message-wrapper {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease;
        }
        
        .message-avatar {
            flex-shrink: 0;
        }
        
        .message-avatar img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }
        
        .message-content {
            flex: 1;
            max-width: 70%;
        }
        
        .message-own-wrapper {
            justify-content: flex-end;
        }
        
        .message-own-wrapper .message-content {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        
        .message-bubble {
            padding: 12px 16px;
            border-radius: 20px;
            position: relative;
            word-wrap: break-word;
        }
        
        .message-own .message-bubble {
            background: #0084ff;
            color: white;
            border-bottom-right-radius: 4px;
        }
        
        .message-other .message-bubble {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
        }
        
        .message-sender {
            font-size: 12px;
            margin-bottom: 4px;
            font-weight: bold;
        }
        
        .message-own .message-sender {
            color: rgba(255,255,255,0.8);
            text-align: right;
        }
        
        .message-other .message-sender {
            color: #666;
        }
        
        .message-text {
            font-size: 14px;
            line-height: 1.5;
        }
        
        .message-time {
            font-size: 10px;
            margin-top: 4px;
            opacity: 0.7;
        }
        
        .message-own .message-time {
            text-align: right;
        }
        
        /* Typing Indicator */
        .typing-indicator {
            background: white;
            padding: 12px 16px;
            border-radius: 20px;
            border-bottom-left-radius: 4px;
            display: inline-flex;
            gap: 4px;
            align-items: center;
        }
        
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }
        
        .typing-indicator span:nth-child(1) { animation-delay: 0s; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }
        
        /* Input Area */
        .input-area {
            background: white;
            border-top: 1px solid #e4e6eb;
            padding: 15px 20px;
        }
        
        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        #messageInput { 
            flex: 1;
            padding: 12px 18px;
            border: 1px solid #e4e6eb;
            border-radius: 25px;
            font-size: 14px;
            background: #f0f2f5;
            transition: all 0.2s;
        }
        
        #messageInput:focus {
            outline: none;
            background: white;
            border-color: #0084ff;
        }
        
        #sendButton { 
            padding: 10px 25px;
            background: #0084ff;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
        }
        
        #sendButton:hover {
            background: #0073e6;
        }
        
        .back-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            transition: background 0.2s;
        }
        
        .back-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        #messages::-webkit-scrollbar {
            width: 8px;
        }
        
        #messages::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        
        #messages::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }
        
        #messages::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div class="jarvis-header">
        <div class="d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <a href="{% url 'chat_rooms' %}" class="back-btn">
                    <i class="bi bi-arrow-left"></i> Back
                </a>
                <div>
                    <h1 class="fs-4 m-0">
                        <i class="bi bi-robot"></i> JARVIS
                    </h1>
                    <small class="opacity-75">Your Personal AI Assistant</small>
                </div>
            </div>
            <div class="d-flex align-items-center gap-2">
                {% if current_user_profile %}
                    <img src="{{ current_user_profile }}" class="rounded-circle" style="width: 35px; height: 35px; object-fit: cover;">
                {% else %}
                    <i class="bi bi-person-circle fs-4"></i>
                {% endif %}
                <span>{{ username }}</span>
            </div>
        </div>
    </div>
    
    <div id="messages">
        <div class="message-wrapper">
            <div class="message-avatar">
                <div style="width: 40px; height: 40px; background: #9b59b6; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                    <i class="bi bi-robot text-white"></i>
                </div>
            </div>
            <div class="message-content">
                <div class="message message-other">
                    <div class="message-bubble">
                        <div class="message-sender">JARVIS</div>
                        <div class="message-text">
                            Hello {{ username }}! I'm JARVIS, your personal AI assistant. 🚀<br>
                            Ask me anything - I can help with coding, answer questions, give advice, or just chat!
                        </div>
                        <div class="message-time">Just now</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" id="messageInput" placeholder="Ask me anything..." autocomplete="off">
            <button id="sendButton">
                <i class="bi bi-send"></i> Send
            </button>
        </div>
    </div>

    <script>
        const username = "{{ username|escapejs }}";
        let conversationHistory = [];
        let isWaitingForResponse = false;
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function addMessage(message, isUser, timestamp = null) {
            const messagesDiv = document.getElementById('messages');
            const messageWrapper = document.createElement('div');
            
            if (isUser) {
                messageWrapper.className = 'message-wrapper message-own-wrapper';
                messageWrapper.innerHTML = `
                    <div class="message-content">
                        <div class="message message-own">
                            <div class="message-bubble">
                                <div class="message-sender">${escapeHtml(username)}</div>
                                <div class="message-text">${escapeHtml(message)}</div>
                                <div class="message-time">Just now</div>
                            </div>
                        </div>
                    </div>
                    <div class="message-avatar">
                        {% if current_user_profile %}
                            <img src="{{ current_user_profile }}" alt="You">
                        {% else %}
                            <div style="width: 40px; height: 40px; background: #0084ff; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                                <i class="bi bi-person text-white"></i>
                            </div>
                        {% endif %}
                    </div>
                `;
            } else {
                messageWrapper.className = 'message-wrapper';
                messageWrapper.innerHTML = `
                    <div class="message-avatar">
                        <div style="width: 40px; height: 40px; background: #9b59b6; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                            <i class="bi bi-robot text-white"></i>
                        </div>
                    </div>
                    <div class="message-content">
                        <div class="message message-other">
                            <div class="message-bubble">
                                <div class="message-sender">JARVIS</div>
                                <div class="message-text">${escapeHtml(message)}</div>
                                <div class="message-time">Just now</div>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            messagesDiv.appendChild(messageWrapper);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        function showTypingIndicator() {
            const messagesDiv = document.getElementById('messages');
            const indicator = document.createElement('div');
            indicator.className = 'message-wrapper';
            indicator.id = 'typingIndicator';
            indicator.innerHTML = `
                <div class="message-avatar">
                    <div style="width: 40px; height: 40px; background: #9b59b6; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                        <i class="bi bi-robot text-white"></i>
                    </div>
                </div>
                <div class="message-content">
                    <div class="message message-other">
                        <div class="typing-indicator">
                            <span></span><span></span><span></span>
                        </div>
                    </div>
                </div>
            `;
            messagesDiv.appendChild(indicator);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        function hideTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) {
                indicator.remove();
            }
        }
        
        async function sendMessage() {
            if (isWaitingForResponse) return;
            
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            // Clear input
            input.value = '';
            
            // Add user message to chat
            addMessage(message, true);
            
            // Add to conversation history
            conversationHistory.push({ role: 'user', content: message });
            
            // Show typing indicator
            showTypingIndicator();
            isWaitingForResponse = true;
            
            try {
                const response = await fetch('/chat/ai-chat-api/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({
                        message: message,
                        history: conversationHistory
                    })
                });
                
                const data = await response.json();
                hideTypingIndicator();
                
                if (data.success) {
                    addMessage(data.response, false);
                    conversationHistory.push({ role: 'assistant', content: data.response });
                } else {
                    addMessage("Sorry, I'm having trouble connecting. Please try again.", false);
                }
            } catch (error) {
                console.error('Error:', error);
                hideTypingIndicator();
                addMessage("Sorry, there was an error. Please try again.", false);
            }
            
            isWaitingForResponse = false;
        }
        
        function getCookie(name) {
            let value = null;
            if (document.cookie) {
                document.cookie.split(';').forEach(c => {
                    const [key, val] = c.trim().split('=');
                    if (key === name) value = decodeURIComponent(val);
                });
            }
            return value;
        }
        
        // Event Listeners
        document.getElementById('sendButton').onclick = sendMessage;
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
        
        // Focus on input
        document.getElementById('messageInput').focus();
    </script>
</body>
</html>
